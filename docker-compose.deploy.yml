# Deploy-host overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
# or set COMPOSE_FILE in .env (see .env.example) and just run
#   docker compose up -d
#
# For a host that already runs something on 80/443 (nginx-proxy-manager,
# Traefik, another Caddy…). We:
#   - drop caddy, which would fight for those ports
#   - publish the api directly on ${API_HOST_PORT}
#   - skip minio (enable the with-minio profile once you ingest blobs)
#
# EVERYTHING HOST-SPECIFIC IN HERE COMES FROM .env. Do not hardcode your
# IP, NIC or ports in this file — it is version-controlled, so a later
# `git pull` would overwrite them and take your deployment down. Put the
# values in .env instead, and any extra local tuning (memory limits,
# extra mounts) in docker-compose.local.yml, which is gitignored.

services:

  caddy:
    profiles: ["with-caddy"]   # disabled by default

  minio:
    profiles: ["with-minio"]   # disabled by default

  minio-init:
    profiles: ["with-minio"]

  auth-broker:
    profiles: ["with-broker"]  # enable once a tailnet API key is configured

  api:
    ports:
      # API_BIND_ADDR pins the api to one interface. Default 0.0.0.0
      # publishes on every interface, which on a host that is also on a
      # tailnet means the api is reachable from the tailnet too — set it
      # to your LAN IP if you do not want that.
      - "${API_BIND_ADDR:-0.0.0.0}:${API_HOST_PORT:-18080}:8080"

  http-boot:
    # No host port — only reachable via the docker network and caddy.
    environment:
      API_INTERNAL_URL: https://api:8443

  dnsmasq:
    profiles: ["lan-pxe"]
    environment:
      # proxyDHCP has to run on the NIC facing the target machines, and
      # it must be the real interface name on this host (`ip -br link`).
      LISTEN_INTERFACE: ${PXE_INTERFACE:?set PXE_INTERFACE in .env, e.g. eth0}
      SUBNET: ${PXE_SUBNET:?set PXE_SUBNET in .env, e.g. 192.168.1.0}
      TFTP_SERVER_IP: ${PXE_TFTP_SERVER_IP:?set PXE_TFTP_SERVER_IP in .env}
      DEPLOY_FQDN: ${DEPLOY_FQDN}
