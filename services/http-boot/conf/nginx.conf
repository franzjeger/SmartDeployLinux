user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    tcp_nopush    on;
    aio           on;
    directio      4m;
    output_buffers 2 32k;

    log_format json escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"path":"$request_uri","status":$status,"sent":$bytes_sent,'
        '"ua":"$http_user_agent","ref":"$http_referer","rt":$request_time}';
    access_log /dev/stdout json;

    server {
        listen 8443 ssl;
        ssl_certificate     /secrets/http-boot.pem;
        ssl_certificate_key /secrets/http-boot-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Token-based iPXE script (the secure path; SECURITY.md §4 #1).
        # Token is 43 chars of base64url + dashes/underscores.
        location ~ "^/boot/([A-Za-z0-9_-]{16,})\.ipxe$" {
            proxy_pass http://127.0.0.1:8444/render/by-token/$1;
            proxy_set_header X-Source-IP $remote_addr;
        }
        # Cloud-init / autoinstall by token. Same token, separate path.
        location ~ "^/boot/([A-Za-z0-9_-]{16,})/(user-data|meta-data|vendor-data)$" {
            proxy_pass http://127.0.0.1:8444/render/by-token/$1/$2;
        }
        # Interactive PXE menu (Phase 23). Same network-trust model as
        # the legacy by-mac path below; PXE_MENU_MODE on the api decides
        # what the menu may deploy.
        location ~ ^/boot/menu/by-mac/([0-9a-fA-F:.-]+)\.ipxe$ {
            proxy_pass http://127.0.0.1:8444/render/menu/by-mac/$1;
            proxy_set_header X-Source-IP $remote_addr;
        }
        location ~ "^/boot/menu/deploy/([0-9a-fA-F:.-]+)/(assigned|[0-9a-fA-F-]{36})\.ipxe$" {
            proxy_pass http://127.0.0.1:8444/render/menu/deploy/$1/$2;
            proxy_set_header X-Source-IP $remote_addr;
        }

        # Legacy by-mac path for LAN-PXE chainload (still authenticated by
        # tailnet ACL or by network locality; not exposed to public WAN).
        location ~ ^/boot/by-mac/([0-9a-fA-F:.-]+)\.ipxe$ {
            proxy_pass http://127.0.0.1:8444/render/by-mac/$1;
            proxy_set_header X-Source-IP $remote_addr;
        }

        # Static blobs (images, drivers).
        location /blobs/ {
            alias /var/lib/http-boot/blobs/;
            autoindex off;
            sendfile on;
            tcp_nopush on;
            add_header X-Content-Type-Options nosniff;
        }

        # WIM / kernel / initrd / wimboot static.
        location /static/ {
            alias /var/lib/http-boot/static/;
            autoindex off;
        }

        location = /healthz { return 200 "ok\n"; }
    }
}
