user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    tcp_nopush    on;
    aio           on;
    directio      4m;
    output_buffers 2 32k;

    log_format json escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"path":"$request_uri","status":$status,"sent":$bytes_sent,'
        '"ua":"$http_user_agent","ref":"$http_referer","rt":$request_time}';
    access_log /dev/stdout json;
    # Local mirror cache for catalog net-installs (kernel/initrd/repo/ISO).
    proxy_cache_path /var/cache/mirrors levels=1:2 keys_zone=mirrors:100m max_size=80g inactive=90d use_temp_path=off;

    # Plain-HTTP listener for the installer hop only.
    #
    # An OS installer's initrd trusts the public CA set and nothing else.
    # When the deploy server presents an internal-CA cert — the normal
    # case for LAN PXE — cloud-init cannot fetch its answer file over
    # HTTPS at all, so an autoinstall dies at "ds=nocloud-net" with a
    # TLS error and no way for the operator to see why.
    #
    # Only the token-scoped answer-file and static-media routes are
    # exposed here. The one-shot token in the path is the authenticator
    # (SECURITY.md §4 #1) and is single-use; what plain HTTP costs is
    # confidentiality of the answer file on the deployment LAN, which is
    # the same trust boundary PXE itself already assumes. Everything
    # else — the menu, by-mac scripts, blobs — stays HTTPS-only.
    server {
        listen 8080;
        # Caching reverse-proxy for distro mirrors: /cache/<host>/<path>
        # fetches from the mirror once, then serves from local disk. slice
        # keeps large ISOs range-cacheable.
        location ~ "^/cache/([^/]+)/(.*)$" {
            set $mirror_host $1;
            resolver 192.168.200.1 9.9.9.9 valid=300s ipv6=off;
            proxy_pass http://$mirror_host/$2$is_args$args;
            proxy_set_header Host $mirror_host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            slice 8m;
            proxy_set_header Range $slice_range;
            proxy_cache mirrors;
            proxy_cache_key "$mirror_host/$2 $slice_range";
            proxy_cache_valid 200 206 90d;
            proxy_cache_lock on;
            proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location ~ "^/boot/([A-Za-z0-9_-]{16,})/(user-data|meta-data|vendor-data)$" {
            proxy_pass http://127.0.0.1:8444/render/by-token/$1/$2;
        }

        location /static/ {
            alias /var/lib/http-boot/static/;
            autoindex off;
            sendfile on;
            tcp_nopush on;
        }

        location = /healthz { return 200 "ok\n"; }
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /secrets/http-boot.pem;
        ssl_certificate_key /secrets/http-boot-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Token-based iPXE script (the secure path; SECURITY.md §4 #1).
        # Token is 43 chars of base64url + dashes/underscores.
        location ~ "^/boot/([A-Za-z0-9_-]{16,})\.ipxe$" {
            proxy_pass http://127.0.0.1:8444/render/by-token/$1;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }
        # Cloud-init / autoinstall by token. Same token, separate path.
        location ~ "^/boot/([A-Za-z0-9_-]{16,})/(user-data|meta-data|vendor-data)$" {
            proxy_pass http://127.0.0.1:8444/render/by-token/$1/$2;
        }
        # Interactive PXE menu (Phase 23). Same network-trust model as
        # the legacy by-mac path below; PXE_MENU_MODE on the api decides
        # what the menu may deploy.
        location ~ ^/boot/menu/by-mac/([0-9a-fA-F:.-]+)\.ipxe$ {
            proxy_pass http://127.0.0.1:8444/render/menu/by-mac/$1;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }
        location ~ "^/boot/menu/deploy/([0-9a-fA-F:.-]+)/(assigned|[0-9a-fA-F-]{36})\.ipxe$" {
            proxy_pass http://127.0.0.1:8444/render/menu/deploy/$1/$2;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Legacy by-mac path for LAN-PXE chainload (still authenticated by
        # tailnet ACL or by network locality; not exposed to public WAN).
        location ~ ^/boot/by-mac/([0-9a-fA-F:.-]+)\.ipxe$ {
            proxy_pass http://127.0.0.1:8444/render/by-mac/$1;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Distro catalog (netboot.xyz-style). The api renders the menu on
        # its public listener; the menu items chain straight to upstream
        # mirrors. Proxy /catalog/ to the api so the HTTPS chain resolves.
        # Self-service enrollment from the "Gather Computer Info" menu item.
        # Bootstrap-stick redeem (off-LAN tailnet path): proxy to the auth-broker.
        location /api/v1/bootstrap/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $ab_upstream auth-broker;
            proxy_pass http://$ab_upstream:8081$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location = /enroll {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $enroll_upstream api;
            proxy_pass http://$enroll_upstream:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /catalog/ {
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $api_upstream api;
            proxy_pass http://$api_upstream:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Source-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        # Static blobs (images, drivers).
        location /blobs/ {
            alias /var/lib/http-boot/blobs/;
            autoindex off;
            sendfile on;
            tcp_nopush on;
            add_header X-Content-Type-Options nosniff;
        }

        # WIM / kernel / initrd / wimboot static.
        location /static/ {
            alias /var/lib/http-boot/static/;
            autoindex off;
        }

        location = /healthz { return 200 "ok\n"; }
    }
}
