# proxyDHCP + TFTP only. We do NOT serve DHCP leases — the existing
# site DHCP server keeps that responsibility. dnsmasq's proxyDHCP mode
# answers DHCPDISCOVER with vendor-specific options that tell the
# client what binary to TFTP and from where, without conflicting with
# the lease-issuing server.
#
# This file is overridden at container start by entrypoint.sh, which
# substitutes $LISTEN_INTERFACE and $TFTP_SERVER_IP from env.

# Listen on the host interface specified via LISTEN_INTERFACE
interface=__INTERFACE__
bind-interfaces

# proxyDHCP on the LAN: same subnet as the existing DHCP server.
dhcp-range=__SUBNET__,proxy

# TFTP enabled; root is /tftproot.
enable-tftp
tftp-root=/tftproot

# Per-architecture boot filename. The PXE client option 93 (Client
# System Architecture) tells us what binary to hand out.
# 0x0000 = legacy BIOS (PCBIOS)
# 0x0006 = x86 UEFI
# 0x0007 = x64 UEFI
# 0x0009 = EBC
# 0x000a = ARM 32-bit UEFI
# 0x000b = ARM 64-bit UEFI
# 0x000f = HTTPClient x64 (UEFI HTTP Boot)
# Two-stage boot detection. user-class=iPXE means the firmware already
# loaded ipxe.efi and is now booting iPXE itself; serve the chain script
# instead of looping back into ipxe.efi.
dhcp-match=set:ipxe,option:user-class,iPXE
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi32,option:client-arch,6
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efiarm64,option:client-arch,11
dhcp-match=set:efihttp,option:client-arch,16

# iPXE second stage — match wins over per-arch because it's listed first.
dhcp-boot=tag:ipxe,default.ipxe,__TFTP_SERVER_IP__

# First stage: firmware boots iPXE binary by client architecture.
dhcp-boot=tag:bios,undionly.kpxe,__TFTP_SERVER_IP__
dhcp-boot=tag:efi32,ipxe-i386.efi,__TFTP_SERVER_IP__
dhcp-boot=tag:efi64,ipxe.efi,__TFTP_SERVER_IP__
dhcp-boot=tag:efiarm64,ipxe-arm64.efi,__TFTP_SERVER_IP__
dhcp-boot=tag:efihttp,http://__DEPLOY_FQDN__/boot/by-mac/${client-mac}.ipxe,__TFTP_SERVER_IP__

# Avoid dnsmasq trying to be a DNS server too — pure proxyDHCP+TFTP.
port=0

# Logging
log-dhcp
log-queries=extra
log-facility=-
