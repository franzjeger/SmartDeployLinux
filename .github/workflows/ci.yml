name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE: this used to be a 6-service build matrix plus 3 auxiliary jobs.
# The runner pool serving this repository hard-fails jobs it cannot
# provision (instant failure, runner_id 0, no steps executed) instead of
# queueing them, and at 9 parallel runner requests every run lost a
# random subset. Everything is consolidated into one job — a single
# runner request per run — with the same coverage, sequenced steps, and
# a trailing e2e stage.

jobs:
  ci:
    name: build / vet / test / e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache: true
          cache-dependency-path: |
            services/api/go.sum
            services/auth-broker/go.sum
            services/http-boot/go.sum
            services/sdk/spectest/go.sum
            tests/e2e/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/sdk-ts/package-lock.json

      - name: build / vet / test all services
        env:
          # Only the api module has integration tests that require this.
          # Other modules ignore the env var.
          DEPLOY_TEST_PG_DSN: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
        run: |
          set -euo pipefail
          for svc in auth-broker api http-boot edge-agent worker deployctl sdk; do
            echo "::group::$svc"
            ( cd "services/$svc" &&
              go mod download &&
              go build ./... &&
              go vet ./... &&
              go test ./... -count=1 )
            echo "::endgroup::"
          done
          # The SDK's spec-parity tests live in a separate internal module
          # (so their YAML dep never ships in the SDK); run it explicitly.
          echo "::group::sdk/spectest"
          ( cd services/sdk/spectest &&
            go mod download &&
            go vet ./... &&
            go test ./... -count=1 )
          echo "::endgroup::"

      - name: typescript sdk — build / test
        working-directory: services/sdk-ts
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: syntax-check shell scripts
        run: |
          set -euo pipefail
          for f in $(git ls-files | grep -E '\.(sh)$|^bootstrap/overlay/etc/init\.d/|^bootstrap/overlay/usr/local/bin/'); do
            if head -n1 "$f" | grep -q bash; then
              bash -n "$f"
            else
              sh -n "$f"
            fi
            echo "ok: $f"
          done

      - name: shellcheck (advisory)
        # Don't fail the build on style warnings; this is informational.
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck || exit 0
          for f in $(git ls-files '*.sh'); do
            shellcheck -S warning "$f" || true
          done

      - name: govulncheck (blocking)
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          for svc in auth-broker api http-boot edge-agent worker deployctl sdk; do
            echo "::group::$svc"
            ( cd "services/$svc" && govulncheck ./... )
            echo "::endgroup::"
          done

      - name: gosec high-severity (advisory)
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest || exit 0
          for svc in auth-broker api http-boot edge-agent worker deployctl sdk; do
            ( cd "services/$svc" && gosec -severity high ./... ) || true
          done

      - name: HA + observability compose configs validate
        run: |
          docker compose -f docker-compose.ha.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q
        env:
          POSTGRES_HOST: pg.example.com
          POSTGRES_USER: x
          POSTGRES_PASSWORD: x
          POSTGRES_DB: x
          S3_ENDPOINT: http://s3.example.com
          DEPLOY_FQDN: deploy.example.com

      - name: deploy-spine e2e smoke
        working-directory: tests/e2e
        env:
          DEPLOY_TEST_PG_DSN: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
        run: go test ./... -count=1 -v

      # Runs last: it drops the schema (including schema_migrations), so
      # every earlier stage that relies on the migrated DB must already
      # be done.
      - name: migrations apply from scratch
        env:
          PGPASSWORD: test
        run: |
          set -euo pipefail
          # ubuntu-latest ships psql; only hit apt if it's missing.
          command -v psql >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q postgresql-client; }
          psql -h 127.0.0.1 -U test -d test -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          for f in services/api/internal/store/migrations/*.sql; do
            echo "applying $f"
            psql -h 127.0.0.1 -U test -d test -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h 127.0.0.1 -U test -d test -c '\dt' | tee /tmp/tables.txt
          n=$(grep -c 'public ' /tmp/tables.txt || true)
          if [ "$n" -lt 21 ]; then
            echo "expected at least 21 tables, found $n"
            exit 1
          fi
