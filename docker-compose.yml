# Small-tier deploy: single host, all services on one docker network.
# State lives in the postgres and minio volumes. App containers are stateless.
#
# Production: read docker-compose.ha.yml. This file is for the lab/single-host
# tier; do not run it directly in production without externalizing the DB and
# object store.

name: deployserver

networks:
  deploy:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
# Note: ./secrets/ is bind-mounted into each service. Generate it with
# `make secrets` (one-time per deploy). It is gitignored.

services:

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    networks: [deploy]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    networks: [deploy]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    # NB: mc has its OWN release train — the server's RELEASE date is not
    # a valid mc tag. Pinning them identically made `docker compose up`
    # fail on the stock small tier with "manifest not found".
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks: [deploy]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}
        mc mb -p local/${S3_BUCKET_IMAGES} || true
        mc mb -p local/${S3_BUCKET_DRIVERS} || true
        mc mb -p local/${S3_BUCKET_BLOBS} || true
        mc anonymous set-json /dev/null local/${S3_BUCKET_IMAGES} || true
        echo "buckets ready"

  api:
    image: ${REGISTRY:-localhost}/deployserver-api:${TAG:-dev}
    build:
      context: ./services/api
    restart: unless-stopped
    networks: [deploy]
    depends_on:
      postgres:
        condition: service_healthy
    # Note: api does NOT depend_on minio. The api uses minio only for
    # blob fetches, which happen lazily; running without minio is a
    # supported deploy mode (e.g. when blobs live in external S3 or are
    # not yet ingested).
    environment: &common-env
      INTERNAL_TLS_CERT: /secrets/api.pem
      INTERNAL_TLS_KEY: /secrets/api-key.pem
      INTERNAL_CA_CERT_PATH: /secrets/internal-ca.pem
      API_INTERNAL_LISTEN: ":8443"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}
      DEPLOY_TAILNET: ${DEPLOY_TAILNET}
      DEPLOY_CA_CERT_PATH: ${DEPLOY_CA_CERT_PATH}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_IMAGES: ${S3_BUCKET_IMAGES}
      S3_BUCKET_DRIVERS: ${S3_BUCKET_DRIVERS}
      S3_BUCKET_BLOBS: ${S3_BUCKET_BLOBS}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL}
      API_LISTEN: ${API_LISTEN}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      DEPLOY_FQDN: ${DEPLOY_FQDN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      AUTH_BROKER_ISSUE_SHARED_SECRET: ${AUTH_BROKER_ISSUE_SHARED_SECRET}
      EDGE_WAKE_TOKEN: ${EDGE_WAKE_TOKEN}
      PXE_MENU_MODE: ${PXE_MENU_MODE}
      PXE_MENU_TIMEOUT_MS: ${PXE_MENU_TIMEOUT_MS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOG_FORMAT: ${LOG_FORMAT}
    volumes:
      - ./secrets:/secrets:ro
    # The runtime image is distroless — no shell, no curl — so the probe
    # has to be the binary itself. Without this, a container that has
    # crashed its listener still reports "Up" in `docker compose ps`.
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-broker:
    image: ${REGISTRY:-localhost}/deployserver-auth-broker:${TAG:-dev}
    build:
      context: ./services/auth-broker
    restart: unless-stopped
    networks: [deploy]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      AUTH_BROKER_LISTEN: ${AUTH_BROKER_LISTEN}
      AUTH_BROKER_DEFAULT_CODE_TTL: ${AUTH_BROKER_DEFAULT_CODE_TTL}
      AUTH_BROKER_TS_AUTHKEY_TTL: ${AUTH_BROKER_TS_AUTHKEY_TTL}
      AUTH_BROKER_RATE_LIMIT_REDEEM_PER_IP_PER_HOUR: ${AUTH_BROKER_RATE_LIMIT_REDEEM_PER_IP_PER_HOUR}
      AUTH_BROKER_RATE_LIMIT_REDEEM_PER_CODE: ${AUTH_BROKER_RATE_LIMIT_REDEEM_PER_CODE}
      HEADSCALE_URL: ${HEADSCALE_URL}
      HEADSCALE_API_KEY: ${HEADSCALE_API_KEY}
      HEADSCALE_USER: ${HEADSCALE_USER}
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET}
    volumes:
      - ./secrets:/secrets:ro

  http-boot:
    image: ${REGISTRY:-localhost}/deployserver-http-boot:${TAG:-dev}
    build:
      context: ./services/http-boot
    restart: unless-stopped
    networks: [deploy]
    environment:
      <<: *common-env
      API_INTERNAL_URL: https://api:8443
      INTERNAL_TLS_CERT: /secrets/http-boot.pem
      INTERNAL_TLS_KEY: /secrets/http-boot-key.pem
    volumes:
      - ./secrets:/secrets:ro
    # Probes BOTH halves of the container. nginx (:8443) serving while
    # render (:8444) is dead still breaks every /boot/* route, and vice
    # versa, so checking one alone would hide a half-dead container.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8443/healthz && curl -fs http://localhost:8444/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ${REGISTRY:-localhost}/deployserver-worker:${TAG:-dev}
    build:
      context: ./services/worker
    restart: unless-stopped
    networks: [deploy]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL}
      NOTIFY_WEBHOOK_TOKEN: ${NOTIFY_WEBHOOK_TOKEN}
    volumes:
      - ./secrets:/secrets:ro

  # The operator UI is embedded in the api binary (services/api/internal/ui);
  # there is no separate ui container.

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    networks: [deploy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/http-boot/conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - auth-broker
      - http-boot

  # Optional in small-tier; only needed for the LAN-PXE secondary path.
  # Comment out if you only deploy via USB bootstrap.
  dnsmasq:
    image: ${REGISTRY:-localhost}/deployserver-tftp:${TAG:-dev}
    build:
      context: ./services/tftp
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_BIND_SERVICE]
    profiles: ["lan-pxe"]
    volumes:
      - ./services/tftp/tftproot:/tftproot:ro
